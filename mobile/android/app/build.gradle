apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * VornexZPay Android Build Configuration
 */

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace "com.vornexzpay"
    
    defaultConfig {
        applicationId "com.vornexzpay"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        
        // Configurações para VornexZPay
        resValue "string", "app_name", "VornexZPay"
        resValue "string", "server_client_id", "your_oauth_client_id"
        
        // Configuração de rede
        useLibrary 'org.apache.http.legacy'
        
        // Multi-dex support
        multiDexEnabled true
        
        // Vector drawables support
        vectorDrawables.useSupportLibrary = true
        
        ndk {
            abiFilters "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            
            // Configurações de otimização
            shrinkResources true
            zipAlignEnabled true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    
    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libjsc.so"
    }
    
    // Configurações de lint
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    
    // React Native
    implementation "com.facebook.react:react-native:+"
    
    // AndroidX
    implementation "androidx.core:core:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity:1.6.1"
    
    // Material Design
    implementation "com.google.android.material:material:1.8.0"
    
    // Biometria
    implementation "androidx.biometric:biometric:1.1.0"
    
    // Keychain/KeyStore
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    
    // Permissions
    implementation "com.google.android.gms:play-services-base:18.2.0"
    
    // Firebase (se necessário para notificações)
    // implementation platform('com.google.firebase:firebase-bom:32.0.0')
    // implementation 'com.google.firebase:firebase-messaging'
    
    // Hermes
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Aplicar configurações específicas do React Native
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)